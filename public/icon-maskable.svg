<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="goldGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="tealGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Centered scaled content (safe zone 80% circle) -->
  <g transform="translate(256, 256) scale(0.72) translate(-256, -256)">
    <!-- Subtle track lines -->
    <circle cx="256" cy="256" r="210" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="12 10"/>
    <circle cx="256" cy="256" r="170" fill="none" stroke="#818cf8" stroke-width="3" stroke-opacity="0.25"/>

    <!-- Pulse / VMA speed wave -->
    <path d="M 90 370 Q 140 370 170 330 T 230 400 T 280 290 T 340 380 Q 380 370 420 370" fill="none" stroke="url(#goldGradMask)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

    <!-- Runner / Athlete Figure -->
    <g transform="translate(4, -10)">
      <!-- Runner Head -->
      <circle cx="316" cy="148" r="32" fill="#ffffff"/>

      <!-- Runner Torso & Limbs -->
      <path d="M 292 186 L 246 250 L 278 286 L 314 262 L 348 238" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Forward Leg -->
      <path d="M 246 250 L 194 300 L 160 360" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Trailing Leg -->
      <path d="M 278 286 L 340 330 L 396 352" fill="none" stroke="url(#tealGradMask)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Front Arm -->
      <path d="M 302 206 L 372 200 L 400 170" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Back Arm -->
      <path d="M 272 216 L 210 230 L 180 200" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- EPS Badge text -->
    <g transform="translate(256, 440)">
      <rect x="-80" y="-24" width="160" height="42" rx="21" fill="#1e1b4b" fill-opacity="0.8" stroke="#a5b4fc" stroke-width="2"/>
      <text x="0" y="5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">EPS VMA</text>
    </g>
  </g>
</svg>