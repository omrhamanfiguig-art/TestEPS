    <title>روائز التربية البدنية والرياضية</title>
    <script>
      // Suppress harmless Vite HMR WebSocket connection errors inside the AI Studio iframe/proxy environment
      const origConsoleError = console.error;
      console.error = function(...args) {
        const text = args.map(function(a) {
          if (!a) return '';
          if (a instanceof Error) return a.message + ' ' + (a.stack || '');
          if (typeof a === 'object') {
            try { return JSON.stringify(a); } catch(e) { return String(a); }
          }
          return String(a);
        }).join(' ');

        if (text.includes('WebSocket closed without opened') || 
            (text.includes('[vite]') && (text.includes('WebSocket') || text.includes('ws') || text.includes('opened') || text.includes('close')))) {
          return; // Completely suppress Vite HMR WebSocket connection errors
        }
        return origConsoleError.apply(console, args);
      };

      // Intercept window.onerror to suppress any WebSocket or HMR connection errors
      window.onerror = function(message, source, lineno, colno, error) {
        const msg = String(message || '') + ' ' + (error && error.message ? error.message : '');
        if (msg.includes('WebSocket') || msg.includes('wss:') || msg.includes('socket') || msg.includes('opened') || msg.includes('[vite]')) {
          return true; // Prevents the browser from treating it as an uncaught exception
        }
        return false;
      };

      // Intercept error event listeners
      window.addEventListener('error', function(e) {
        const msg = (e.message || (e.error && e.error.message) || '');
        if (msg.includes('WebSocket') || msg.includes('wss:') || msg.includes('socket') || msg.includes('opened') || msg.includes('[vite]')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);

      // Intercept unhandled promise rejections
      window.addEventListener('unhandledrejection', function(e) {
        const msg = (e.reason && (e.reason.message || e.reason.stack)) || String(e.reason || '');
        if (msg.includes('WebSocket') || msg.includes('wss:') || msg.includes('socket') || msg.includes('opened') || msg.includes('[vite]')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);

      // Monkeypatch window.WebSocket to safely handle Vite HMR connection attempts
      (function() {
        const OriginalWebSocket = window.WebSocket;
        if (!OriginalWebSocket) return;
        
        const PatchedWebSocket = function(url, protocols) {
          const urlStr = String(url || '');
          const protoStr = String(protocols || '');

          // If this is Vite HMR socket or host socket in dev iframe
          if (protoStr.includes('vite-hmr') || urlStr.includes('vite') || urlStr.includes('europe-west2.run.app') || urlStr.includes('ais-dev')) {
            // Return dummy WebSocket that never triggers error or unclean close
            const dummyWs = {
              readyState: 1, // OPEN
              url: urlStr,
              protocol: protoStr,
              bufferedAmount: 0,
              extensions: '',
              binaryType: 'blob',
              onopen: null,
              onclose: null,
              onerror: null,
              onmessage: null,
              send: function() {},
              close: function(code, reason) {
                this.readyState = 3;
                if (typeof this.onclose === 'function') {
                  this.onclose({ wasClean: true, code: code || 1000, reason: reason || 'Normal' });
                }
              },
              addEventListener: function(event, handler) {
                if (event === 'open') {
                  setTimeout(() => {
                    try { handler({ type: 'open' }); } catch(err) {}
                  }, 10);
                }
              },
              removeEventListener: function() {},
              dispatchEvent: function() { return true; }
            };

            setTimeout(() => {
              if (typeof dummyWs.onopen === 'function') {
                try { dummyWs.onopen({ type: 'open' }); } catch(err) {}
              }
            }, 10);

            return dummyWs;
          }

          try {
            const ws = new OriginalWebSocket(url, protocols);
            
            ws.addEventListener('error', function(event) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.stopPropagation) event.stopPropagation();
            }, { capture: true });
            
            return ws;
          } catch (e) {
            return {
              readyState: 3,
              send: () => {},
              close: () => {},
              addEventListener: () => {},
              removeEventListener: () => {}
            };
          }
        };
        
        PatchedWebSocket.prototype = OriginalWebSocket.prototype;
        for (const key in OriginalWebSocket) {
          if (Object.prototype.hasOwnProperty.call(OriginalWebSocket, key)) {
            PatchedWebSocket[key] = OriginalWebSocket[key];
          }
        }
        window.WebSocket = PatchedWebSocket;
      })();
    </script>
